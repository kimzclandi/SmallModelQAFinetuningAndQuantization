name: offline-integrity
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/verify_artifacts.py
      - run: mkdir -p work
      - run: PYTHONPATH=. python scripts/compare_gold_pilot.py --output work/ci-gold-comparison.json
      - run: python -m qa_lab.teacher_audit --raw data/teacher-received-v1/user-message.txt --output work/ci-teacher-audit
      - run: PYTHONPATH=. python scripts/verify_closure.py
