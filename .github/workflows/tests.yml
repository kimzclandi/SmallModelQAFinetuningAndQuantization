name: offline-integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.lock.txt
      - run: python scripts/acceptance.py --output work/ci-acceptance
      - run: python scripts/diagnose_logits_v2.py verify --output reports/logits-diagnostics-v1
  cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.lock.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_logits_cache_lineage.py tests/test_logits_distillation.py
      - name: Required offline checkpoint identity and load-path contracts
        run: python -m pytest -q tests/test_model_identity.py
